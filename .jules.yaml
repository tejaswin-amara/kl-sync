# Jules by Google Configuration
# https://jules.google.com

target_branch: master
auto_pr: false
direct_commit: true

setup:
  commands:
    - npm ci
    - npx tsc --noEmit
    - npm run lint
    - npm test
    - npm run build

environment:
  node_version: "20"

guidance_files:
  - AGENTS.md
  - ARCHITECTURE.md
  - SECURITY.md
