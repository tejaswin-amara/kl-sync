name: Markdown Link & License Integrity Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      check_network:
        description: 'Run live external URL reachability checks'
        required: false
        default: false
        type: boolean
  schedule:
    # Run live network link verification every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Markdown, Links & License Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Markdown Verifier Test Suite
        run: npx tsx tests/verify-links.test.ts

      - name: Run Markdown & Link Verification (Deterministic Offline Mode)
        run: npx tsx scripts/verify-links.ts --offline --strict --report verification-report.json

      - name: Run Live Network Reachability Check (Scheduled or Dispatch only)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_network == true)
        run: npx tsx scripts/verify-links.ts --online --concurrency 8 --timeout 10000

      - name: Upload Verification Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-node-${{ matrix.node-version }}
          path: verification-report.json
          if-no-files-found: ignore
