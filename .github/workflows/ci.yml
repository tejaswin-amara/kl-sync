name: CI Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        run: npm test

      - name: Run Agent-as-Judge AI Evaluation
        run: npx tsx scripts/agent-as-judge.ts

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          SESSION_SECRET: 'ci-secret-key-testing-minimum-32-bytes-long'
