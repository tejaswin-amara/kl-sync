name: CI Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22]

    env:
      KL_SYNC_DEMO_MODE: 'true'
      KL_SYNC_AI_MODE: 'offline'
      SESSION_SECRET: 'ci-secret-key-testing-minimum-32-bytes-long'
      NODE_ENV: 'test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run Markdown Verifier Test Suite
        run: npx --yes tsx --test tests/verify-links.test.ts tests/challenger-pipeline-adversarial.test.ts

      - name: Run Markdown Link, Anchor & License Verification
        run: npx --yes tsx scripts/verify-links.ts --offline --strict

      - name: Run Agent-as-Judge AI Evaluation
        run: npx --yes tsx scripts/agent-as-judge.ts

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: 'production'
          SESSION_SECRET: 'ci-secret-key-testing-minimum-32-bytes-long'


