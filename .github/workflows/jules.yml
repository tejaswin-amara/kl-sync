name: Jules Automation

on:
  issues:
    types: [labeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  jules:
    name: Execute Jules Direct Master Automation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && github.event.label.name == 'jules') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository (master branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jules Quality Verification
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_SECRET: 'jules-secret-key-testing-minimum-32-bytes-long'

      - name: Create Pull Request for Jules Updates
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v6.0.0
        with:
          commit-message: "chore(jules): automated update"
          title: "chore(jules): automated updates"
          body: "Automated changes generated by Jules. Please review before merging."
          branch: "jules/auto-update"
          base: "master"
          delete-branch: true
