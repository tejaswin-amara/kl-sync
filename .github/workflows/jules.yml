name: Jules Automation

on:
  issues:
    types: [labeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  jules:
    name: Execute Jules Direct Master Automation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issues' && github.event.label.name == 'jules') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout repository (master branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm exec -- playwright install chromium

      - name: Run Jules Quality Verification
        run: npm run verify
        env:
          KL_SYNC_DEMO_MODE: 'true'
          KL_SYNC_AI_MODE: 'offline'
          SESSION_SECRET: 'jules-secret-key-testing-minimum-32-bytes-long'

      - name: Create Pull Request for Jules Updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v6.0.0
        with:
          commit-message: 'chore(jules): automated update'
          title: 'chore(jules): automated updates'
          body: 'Automated changes generated by Jules. Please review before merging.'
          branch: 'jules/auto-update'
          base: 'master'
          delete-branch: true
