version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "tejaswin-amara"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    groups:
      production-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "cheerio"
          - "zod"
          - "ai"
          - "@ai-sdk/*"
      dev-dependencies:
        patterns:
          - "typescript"
          - "eslint*"
          - "@types/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci):"
